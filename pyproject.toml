[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "call-me-maybe"
version = "1.0.0"
description = "Implementing constrained decoding on a small LLM"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pydantic",
    "llm-sdk",
    "flake8",
    "mypy",
]

[project.scripts]
call-me-maybe = "src.__main__:main"

[tool.setuptools]
packages = ["src"]

[tool.uv.sources]
llm-sdk = { path = "./llm_sdk", editable = true }

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
